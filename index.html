<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melven Bagolaque — Full-Stack Developer & Web Designer</title>
    <meta
      name="description"
      content="Portfolio of Melven Bagolaque, a full-stack developer and web designer building fast, modern websites with React, Node.js and WordPress."
    />
    <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Melven Bagolaque — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Fast, modern websites and web apps with React, Node.js and WordPress."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Fonts: preconnect + non-blocking stylesheet with swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Sora:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Apply saved theme before first paint so there is no flash -->
    <script>
      try {
        var t = localStorage.getItem("current-theme");
        if (t === "light") document.documentElement.classList.replace("dark", "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view this portfolio.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
